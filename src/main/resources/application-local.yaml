spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # 운영 DB에서는 의도하지 않은 스키마 변경이 일어날 수 있으므로 로컬에서만 사용하는 것이 좋다
    show-sql: true

server:
  port: 8080
  address: 0.0.0.0



# SQL을 콘솔에 출력
# Entity 변경을 DB 테이블에 자동 반영
# 8080 포트 사용
# HTTPS 전용 쿠키 설정은 사용하지 않음