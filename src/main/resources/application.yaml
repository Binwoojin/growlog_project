spring:
  application:
    name: growlog_project


    # ===========================
    # MySQL (AWS RDS)
    # ===========================


  datasource:
    url: jdbc:mysql://growlog-db.cx46sswa4e8c.ap-northeast-2.rds.amazonaws.com:3306/growlog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver


  # ===========================
  # JPA
  # ===========================


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql=true
    database-platform: org.hibernate.dialect.MySQLDialect

    # ===========================
    # JSP View Resolver
    # ===========================

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

      # ===========================
      # Email 인증 진행을 위한 설정
      # ===========================

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    default-encoding: UTF-8

    properties:
      mail:
        smtp:
          auth: true

          starttls:
            enable: true
            required: true

          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  cors:
    # 콤마로 구분된 허용 Origin 목록. Vue 개발 서버(Vite) 기본 포트를 기본값으로 둔다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}




