spring:
  application:
    name: growlog_project


    # ===========================
    # MySQL (AWS RDS)
    # ===========================


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver


  # ===========================
  # JPA
  # ===========================


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql=true
    open-in-view: false

    # ===========================
    # JSP View Resolver
    # ===========================

  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

      # ===========================
      # Email 인증 진행을 위한 설정
      # ===========================

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    default-encoding: UTF-8

    properties:
      mail:
        smtp:
          auth: true

          starttls:
            enable: true
            required: true

          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
      secret-key: ${AWS_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
    region:
      static: ${AWS_REGION:ap-northeast-2}

app:
  s3:
    bucket: growlog-media-2026

server:
  port: 8080
  address: 0.0.0.0
