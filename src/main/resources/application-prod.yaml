spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

  forward-headers-strategy: framework

  servlet:
    session:
      cookie:
        secure: true

logging:
  level:
    root: info
    org.hibernate.SQL: warn

# 실제 배포 서버용 설정

# DB 테이블을 자동 변경하지 않음
# Entity와 DB 구조가 맞는지만 검사
# SQL을 콘솔에 출력하지 않음
# 환경변수로 포트를 변경할 수 있음
# 세션 쿠키를 HTTPS에서만 전송
# 과도한 상세 로그를 제한

# ddl-auto: validate 주의사항

# 현재 운영 DB 테이블과 Entity 구조가 정확히 일치하지 않을 경우 애플리케이션 실행이 실패할 수 있음
# 처음부터 바로 validate로 바꾸기 어려울 경우
# 1) 로클 프로필에서 정상 실행
# 2) 운영 DB 백업
# 3) 운영 DB와 Entity 구조 확인
# 4) prod 프로필에서 validate 실행
# 5) 구조 오류가 있으면 DB 스키아 정리
# 6) 이후 Flyway 도입